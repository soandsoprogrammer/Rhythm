name: Build Shenye APK

on:
  push:
    branches: [shenye-playback]
    paths:
      - '.github/workflows/build-zh-cn.yml'
      - 'app/src/main/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Check server syntax
        run: node --check server/shenye-server.mjs
      - name: Build the unsigned GitHub release APK
        shell: bash
        run: |
          set -euo pipefail
          version_suffix=$((1362 + GITHUB_RUN_NUMBER))
          version_code=$((565061362 + GITHUB_RUN_NUMBER))
          bash gradlew :app:assembleGithubRelease \
            -PshenyeUnsigned=true \
            -PversionCodeOverride="$version_code" \
            -PversionNameOverride="5.6.506.$version_suffix" \
            --stacktrace
      - name: Verify and stage the offline-signing input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apk_files < <(find app/build/outputs/apk/github/release -maxdepth 1 -type f \
            \( -name '*-githubRelease.apk' -o -name '*-githubRelease-unsigned.apk' -o -name 'app-github-release-unsigned.apk' \))
          test "${apk_files[0]:-}"
          test "${#apk_files[@]}" -eq 1
          apk="${apk_files[0]}"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if "$build_tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Expected an unsigned APK for local signing."
            exit 1
          fi
          "$build_tools/zipalign" -c 4 "$apk"
          "$build_tools/aapt2" dump badging "$apk" > apk-badging.txt
          grep -E "^package: name='app\.shenye\.music'" apk-badging.txt
          grep -E "^locales:.*'zh(-CN)?'" apk-badging.txt
          mkdir verified-apk
          cp "$apk" verified-apk/Shenye-android-unsigned.apk
          cd verified-apk
          sha256sum Shenye-android-unsigned.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Shenye-android-unsigned
          path: verified-apk/
          if-no-files-found: error
